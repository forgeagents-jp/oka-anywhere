name: uptime
# External heartbeat for the Forge stack. Kuma runs ON the VPS, so it cannot
# report the VPS itself dying. This runs from GitHub's infrastructure every
# 15 minutes; a failure opens an issue here, and GitHub emails the owner.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/uptime.yml"]

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        id: probe
        run: |
          set +e
          FAILS=""
          check () {
            local name="$1" url="$2" want="$3"
            local code
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$url")
            if [ "$code" != "$want" ]; then
              sleep 30
              code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "$url")
            fi
            if [ "$code" != "$want" ]; then
              FAILS="$FAILS- **$name** — expected $want, got $code ($url)\n"
            fi
          }
          check "Marketing site"        "https://forgeagentsio.com/"                                            "200"
          check "Console healthz"       "https://console.forgeagentsai.com/healthz"                             "200"
          check "Connector (oka-mcp)"   "https://console.forgeagentsai.com/.well-known/oauth-authorization-server" "200"
          if [ -n "$FAILS" ]; then
            echo "status=down" >> "$GITHUB_OUTPUT"
            printf 'fails<<EOF\n%b\nEOF\n' "$FAILS" >> "$GITHUB_OUTPUT"
          else
            echo "status=up" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update outage issue
        if: steps.probe.outputs.status == 'down'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILS: ${{ steps.probe.outputs.fails }}
        run: |
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label uptime --state open --json number --jq '.[0].number')
          BODY=$(printf 'Down at %s UTC (checked twice, 30s apart):\n\n%s\nRunbook: ssh to the VPS, `docker ps`, then `bash ops/deploy.sh <service>` from /opt/forge-console-new.' "$(date -u '+%Y-%m-%d %H:%M')" "$FAILS")
          if [ -z "$NUM" ]; then
            gh label create uptime -R "$GITHUB_REPOSITORY" --color B60205 --force
            gh issue create -R "$GITHUB_REPOSITORY" --label uptime \
              --title "OUTAGE: endpoint check failing" --body "$BODY"
          else
            gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$BODY"
          fi

      - name: Close recovered issue
        if: steps.probe.outputs.status == 'up'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list -R "$GITHUB_REPOSITORY" --label uptime --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" -R "$GITHUB_REPOSITORY" \
              --comment "Recovered — all three endpoints answering as of $(date -u '+%Y-%m-%d %H:%M') UTC."
          fi
