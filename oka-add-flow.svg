<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" font-family="Inter, Segoe UI, system-ui, sans-serif" role="img" aria-label="How to add the OKA Anywhere connector">
  <style>
    .box{fill:#fffdf9;stroke:#17150f;stroke-width:1.5}
    .accent{fill:#faf8f4;stroke:#a33b1f;stroke-width:2}
    .t{fill:#17150f;font-size:15px}
    .tb{fill:#17150f;font-size:15px;font-weight:600}
    .lbl{fill:#a33b1f;font-size:12.5px;font-weight:600;letter-spacing:.06em}
    .edge{stroke:#4a443a;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    .mono{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13.5px;fill:#a33b1f}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a443a"/>
    </marker>
  </defs>
  <rect width="900" height="1000" fill="#faf8f4"/>

  <!-- start -->
  <rect class="accent" x="270" y="28" width="360" height="64" rx="2"/>
  <text class="tb" x="450" y="54" text-anchor="middle">Have your setup card ready</text>
  <text class="t"  x="450" y="76" text-anchor="middle">connector address + office token</text>
  <path class="edge" d="M450,92 V128"/>

  <!-- decision -->
  <rect class="box" x="360" y="130" width="180" height="46" rx="23"/>
  <text class="tb" x="450" y="158" text-anchor="middle">Which app?</text>

  <!-- branch edges -->
  <path class="edge" d="M382,176 C300,205 250,215 235,240"/>
  <path class="edge" d="M518,176 C600,205 650,215 665,240"/>
  <text class="lbl" x="195" y="222" text-anchor="middle">CLAUDE — WEB · DESKTOP · MOBILE</text>
  <text class="lbl" x="702" y="222" text-anchor="middle">CHATGPT — PLUS · PRO · TEAM</text>

  <!-- Claude column -->
  <rect class="box" x="80" y="244" width="310" height="46"/>
  <text class="t" x="235" y="272" text-anchor="middle">Settings → Connectors → <tspan class="tb">Add custom connector</tspan></text>
  <path class="edge" d="M235,290 V318"/>
  <rect class="box" x="80" y="320" width="310" height="58"/>
  <text class="t" x="235" y="343" text-anchor="middle">Paste the address:</text>
  <text class="mono" x="235" y="365" text-anchor="middle">console.forgeagentsai.com/mcp</text>
  <path class="edge" d="M235,378 C235,420 340,440 400,458"/>

  <!-- ChatGPT column -->
  <rect class="box" x="510" y="244" width="310" height="46"/>
  <text class="t" x="665" y="272" text-anchor="middle">Settings → turn on <tspan class="tb">Developer mode</tspan></text>
  <path class="edge" d="M665,290 V318"/>
  <rect class="box" x="510" y="320" width="310" height="58"/>
  <text class="t" x="665" y="343" text-anchor="middle">Connectors → Create → same address,</text>
  <text class="t" x="665" y="365" text-anchor="middle">choose <tspan class="tb">OAuth</tspan></text>
  <path class="edge" d="M665,378 C665,420 560,440 500,458"/>

  <!-- converge: connect -->
  <rect class="accent" x="290" y="460" width="320" height="64" rx="2"/>
  <text class="tb" x="450" y="486" text-anchor="middle">Click Connect</text>
  <text class="t"  x="450" y="508" text-anchor="middle">a Forge page opens in your browser</text>
  <path class="edge" d="M450,524 V556"/>

  <!-- token -->
  <rect class="accent" x="290" y="558" width="320" height="52" rx="2"/>
  <text class="tb" x="450" y="589" text-anchor="middle">Paste your office token. Once.</text>
  <path class="edge" d="M450,610 V646"/>

  <!-- claude code side path -->
  <rect class="box" x="620" y="558" width="240" height="88"/>
  <text class="lbl" x="740" y="582" text-anchor="middle">CLAUDE CODE &amp; SCRIPTS</text>
  <text class="t" x="740" y="604" text-anchor="middle">No browser step — send the</text>
  <text class="t" x="740" y="624" text-anchor="middle">office token as a bearer header</text>
  <path class="edge" d="M540,166 C680,158 842,172 860,248 C878,336 848,480 744,556"/>
  <path class="edge" d="M740,646 C740,690 560,700 512,710"/>

  <!-- verify -->
  <rect class="box" x="290" y="648" width="320" height="64"/>
  <text class="tb" x="450" y="674" text-anchor="middle">Verify: four tools appear</text>
  <text class="t"  x="450" y="696" text-anchor="middle">ask · verify · search · boundaries</text>
  <path class="edge" d="M450,712 V748"/>

  <!-- done -->
  <rect class="box" x="220" y="750" width="460" height="86"/>
  <text class="tb" x="450" y="778" text-anchor="middle">Ask about a real policy</text>
  <text class="t" x="450" y="800" text-anchor="middle">The answer cites your document by name and passage —</text>
  <text class="t" x="450" y="820" text-anchor="middle">or says plainly that it is not documented, and who to ask.</text>

  <!-- footer note -->
  <text class="t" x="450" y="905" text-anchor="middle" font-size="13.5" fill="#4a443a">One person does this, once. Everyone in the office benefits.</text>
  <text class="mono" x="450" y="930" text-anchor="middle">forgeagentsio.com · $149/month per office</text>
</svg>
