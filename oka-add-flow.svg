<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="How to add the OKA Anywhere connector">
  <style>
    .box{fill:#fffdf9;stroke:#17150f;stroke-width:1.25;rx:2}
    .accent{fill:#faf0e9;stroke:#a33b1f;stroke-width:1.75}
    .t{fill:#17150f;font-size:14.5px}
    .tb{fill:#17150f;font-size:14.5px;font-weight:600}
    .lbl{fill:#a33b1f;font-size:12px;font-weight:600;letter-spacing:.07em}
    .edge{stroke:#4a443a;stroke-width:1.25;fill:none;marker-end:url(#arr)}
    .mono{font-family:'IBM Plex Mono',Consolas,monospace;font-size:13.5px;fill:#a33b1f}
    .foot{fill:#4a443a;font-size:13.5px}
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a443a"/>
    </marker>
  </defs>
  <rect width="960" height="980" fill="#faf8f4"/>

  <!-- start -->
  <rect class="accent" x="290" y="32" width="380" height="68" rx="2"/>
  <text class="tb" x="480" y="60" text-anchor="middle">Have your setup card ready</text>
  <text class="t"  x="480" y="82" text-anchor="middle">connector address + office token</text>
  <path class="edge" d="M480,100 V134"/>

  <!-- decision -->
  <rect class="box" x="385" y="138" width="190" height="48" rx="24"/>
  <text class="tb" x="480" y="167" text-anchor="middle">Which app?</text>

  <!-- branch edges + labels -->
  <path class="edge" d="M402,186 C320,206 265,222 240,256"/>
  <path class="edge" d="M558,186 C640,206 695,222 720,256"/>
  <text class="lbl" x="230" y="236" text-anchor="middle">CLAUDE — WEB · DESKTOP · MOBILE</text>
  <text class="lbl" x="730" y="236" text-anchor="middle">CHATGPT — PLUS · PRO · TEAM</text>

  <!-- Claude column -->
  <rect class="box" x="60" y="262" width="340" height="64" rx="2"/>
  <text class="t"  x="230" y="288" text-anchor="middle">Settings → Connectors →</text>
  <text class="tb" x="230" y="309" text-anchor="middle">Add custom connector</text>
  <path class="edge" d="M230,326 V350"/>
  <rect class="box" x="60" y="354" width="340" height="64" rx="2"/>
  <text class="t" x="230" y="380" text-anchor="middle">Paste the address:</text>
  <text class="mono" x="230" y="402" text-anchor="middle">console.forgeagentsai.com/mcp</text>
  <path class="edge" d="M230,418 C230,452 360,458 452,470"/>

  <!-- ChatGPT column -->
  <rect class="box" x="560" y="262" width="340" height="64" rx="2"/>
  <text class="t"  x="730" y="288" text-anchor="middle">Settings → turn on</text>
  <text class="tb" x="730" y="309" text-anchor="middle">Developer mode</text>
  <path class="edge" d="M730,326 V350"/>
  <rect class="box" x="560" y="354" width="340" height="64" rx="2"/>
  <text class="t" x="730" y="380" text-anchor="middle">Connectors → Create →</text>
  <text class="t" x="730" y="402" text-anchor="middle">same address, choose <tspan class="tb">OAuth</tspan></text>
  <path class="edge" d="M730,418 C730,452 600,458 508,470"/>

  <!-- converge: connect -->
  <rect class="accent" x="290" y="472" width="380" height="68" rx="2"/>
  <text class="tb" x="480" y="500" text-anchor="middle">Click Connect</text>
  <text class="t"  x="480" y="522" text-anchor="middle">a Forge page opens in your browser</text>
  <path class="edge" d="M480,540 V566"/>

  <!-- token -->
  <rect class="accent" x="290" y="570" width="380" height="52" rx="2"/>
  <text class="tb" x="480" y="601" text-anchor="middle">Paste your office token. Once.</text>
  <path class="edge" d="M480,622 V644"/>

  <!-- Claude Code side path -->
  <path class="edge" d="M575,158 C760,148 908,185 928,268 C948,385 900,495 798,556"/>
  <rect class="box" x="660" y="558" width="260" height="102" rx="2"/>
  <text class="lbl" x="790" y="584" text-anchor="middle">CLAUDE CODE &amp; SCRIPTS</text>
  <text class="t" x="790" y="608" text-anchor="middle">No browser step —</text>
  <text class="t" x="790" y="628" text-anchor="middle">send the office token</text>
  <text class="t" x="790" y="648" text-anchor="middle">as a bearer header</text>
  <path class="edge" d="M790,660 C790,700 736,712 676,716"/>

  <!-- verify -->
  <rect class="box" x="290" y="648" width="380" height="64" rx="2"/>
  <text class="tb" x="480" y="674" text-anchor="middle">Verify: four tools appear</text>
  <text class="t"  x="480" y="696" text-anchor="middle">ask · verify · search · boundaries</text>
  <path class="edge" d="M480,712 V740"/>

  <!-- done -->
  <rect class="box" x="240" y="744" width="480" height="86" rx="2"/>
  <text class="tb" x="480" y="772" text-anchor="middle">Ask about a real policy</text>
  <text class="t" x="480" y="794" text-anchor="middle">The answer cites your document by name and passage —</text>
  <text class="t" x="480" y="814" text-anchor="middle">or says plainly that it is not documented, and who to ask.</text>

  <!-- footer -->
  <line x1="330" y1="880" x2="630" y2="880" stroke="#c7bda9" stroke-width="1"/>
  <text class="foot" x="480" y="916" text-anchor="middle">One person does this, once. Everyone in the office benefits.</text>
  <text class="mono" x="480" y="942" text-anchor="middle">forgeagentsio.com · $149/month per office</text>
</svg>
